<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Gambar Link Saya</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
    
    <!-- b. EMBEDDED STYLE SHEET -->
    <style type="text/css">
        /* Selector 1: Mengatur kontainer halaman lewat body */
        body {
            padding: 40px;
            text-align: center;
            min-height: 100vh;
        }
        /* Selector 2: Mengatur teks paragraf panduan klik */
        p {
            font-size: 16px;
            color: #555555;
            margin-bottom: 30px;
        }
        /* Selector 3: Mengatur area link pembungkus gambar */
        a {
            display: inline-block;
            padding: 10px;
            outline: none;
        }
    </style>
</head>
<body>
    <!-- a. INLINE STYLE SHEET (Selector 1: tag h1) -->
    <h1 style="color: #005fd3; font-weight: bold;">Website Informatika UAJY</h1>
    <p>Klik gambar dibawah ini untuk masuk ke halaman website</p>
    
    <a href="https://inf.uajy.ac.id">
        <!-- a. INLINE STYLE SHEET (Selector 2: tag img) -->
        <img src="https://pawon.uajy.ac.id/images/article/UAJY-LOGO-UNIV_-VERTICAL-STACK-UP_-012.png" 
             alt="Gambar Logo UAJY" 
             height="200px" 
             width="400px" 
             style="border: 2px solid #00b3a4; border-radius: 8px;" />
    </a>
</body>
</html>
